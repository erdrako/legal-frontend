<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LexMapa - Cambios legales claros</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <header class="top-nav">
      <a class="brand-link" href="?view=home" data-view="home" aria-label="LexMapa inicio">
        <span class="brand-mark" aria-hidden="true">LM</span>
        <span>LexMapa</span>
      </a>

      <nav class="nav-list" aria-label="Navegacion principal">
        <a href="?view=home" data-view="home">Inicio</a>
        <a href="?view=cambios" data-view="cambios">Leyes en tratamiento</a>
        <a href="?view=temas" data-view="temas">Temas</a>
        <a href="?view=como-leer" data-view="como-leer">Como leer</a>
        <a href="?view=fuentes" data-view="fuentes">Fuentes</a>
      </nav>

      <form class="header-search" id="global-search-form" data-search-form>
        <label class="sr-only" for="global-search-input">Buscar ley, tema o proyecto</label>
        <input
          id="global-search-input"
          name="q"
          autocomplete="off"
          maxlength="180"
          placeholder="Buscar ley, tema o proyecto..."
        >
        <button type="submit">Buscar</button>
      </form>
    </header>

    <main class="workspace" id="app-root" tabindex="-1"></main>

    <script src="./config.js"></script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
